name: Publish to npm

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run only'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!startsWith(github.event.head_commit.message, 'chore(release):') &&
       !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - name: Determine version bump from git changes and sync release commit
        id: version
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view office-sim version 2>/dev/null || echo "")
          NPM_SHA=$(npm view office-sim gitHead 2>/dev/null || echo "")

          if [ -n "$NPM_SHA" ] && git cat-file -e "${NPM_SHA}^{commit}" 2>/dev/null; then
            RANGE="${NPM_SHA}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --format="%s%n%b" 2>/dev/null || git log -1 --format="%s%n%b")
          echo "Commits in $RANGE:"
          echo "$COMMITS"

          if [ "$LOCAL_VER" = "$NPM_VER" ]; then
            if printf '%s\n' "$COMMITS" | grep -Eq '(^BREAKING[ -]CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:)'; then
              BUMP="major"
            elif printf '%s\n' "$COMMITS" | grep -Eq '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Auto-bumping $LOCAL_VER ($BUMP) based on git commits in $RANGE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
              NEW_VER=$(npm version "$BUMP" --no-git-tag-version)
              git checkout -- package.json
            else
              git fetch origin master
              git rebase origin/master
              NEW_VER=$(npm version "$BUMP" -m "chore(release): v%s [skip ci]")
              git push origin HEAD:master "$NEW_VER"
            fi
          else
            BUMP="manual"
            NEW_VER="v${LOCAL_VER}"
            echo "Using manually bumped version $NEW_VER (npm is at ${NPM_VER:-none})"
            if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.dry_run }}" = "false" ]; then
              if ! git rev-parse "$NEW_VER" >/dev/null 2>&1; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git tag "$NEW_VER"
                git push origin "$NEW_VER"
              fi
            fi
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
      - run: npm pack --dry-run
      - name: Publish package to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --provenance --access public
