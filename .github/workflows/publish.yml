# Releases are manual: this workflow never starts on a push or a merge. Start it from the Actions tab
# (or `gh workflow run publish.yml`). dry_run=true (the default) tests, works out the version and previews the
# tarball. dry_run=false also publishes to npm, pushes the release tag and creates the GitHub Release. When
# package.json still has the version that is on npm, the job bumps it before publishing (a release commit) and
# afterwards pushes that commit to master together with the tag.
# The job releases the ref it is started on and does not check which ref that is: start a real release on master.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: test, work out the version and preview the tarball; publish nothing'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - name: Determine version bump from git changes
        id: version
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          NPM_VER=$(npm view office-sim version 2>/dev/null || echo "")
          NPM_SHA=$(npm view office-sim gitHead 2>/dev/null || echo "")

          if [ -n "$NPM_SHA" ] && git cat-file -e "${NPM_SHA}^{commit}" 2>/dev/null; then
            RANGE="${NPM_SHA}..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi

          COMMITS=$(git log "$RANGE" --format="%s%n%b" 2>/dev/null || git log -1 --format="%s%n%b")
          echo "Commits in $RANGE:"
          echo "$COMMITS"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$LOCAL_VER" = "$NPM_VER" ]; then
            if printf '%s\n' "$COMMITS" | grep -Eq '(^BREAKING[ -]CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:)'; then
              BUMP="major"
            elif printf '%s\n' "$COMMITS" | grep -Eq '^feat(\([^)]+\))?:'; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "Auto-bumping $LOCAL_VER ($BUMP) based on git commits in $RANGE"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              NEW_VER=$(npm version "$BUMP" --no-git-tag-version)
              git checkout -- package.json
            else
              git fetch origin master
              git rebase origin/master
              NEW_VER=$(npm version "$BUMP" -m "chore(release): v%s [skip ci]")
            fi
          else
            BUMP="manual"
            NEW_VER="v${LOCAL_VER}"
            echo "Using version $NEW_VER from package.json (npm is at ${NPM_VER:-none})"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
      - run: npm pack --dry-run
      - name: Publish package to npm
        if: inputs.dry_run == false
        run: |
          if ! env -u NODE_AUTH_TOKEN -u NPM_CONFIG_USERCONFIG npm publish --provenance --access public; then
            echo "OIDC Trusted Publishing unavailable or unconfigured; falling back to NPM_TOKEN..."
            npm publish --provenance --access public
          fi
      - name: Push release commit and tag to master
        if: inputs.dry_run == false
        run: |
          NEW_VER="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.bump }}" != "manual" ]; then
            git push origin HEAD:master "$NEW_VER"
          elif ! git ls-remote --tags origin "refs/tags/$NEW_VER" | grep -q "$NEW_VER"; then
            git tag -f "$NEW_VER"
            git push origin "$NEW_VER"
          fi
      - name: Create GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VER="${{ steps.version.outputs.version }}"
          if ! gh release view "$NEW_VER" >/dev/null 2>&1; then
            gh release create "$NEW_VER" --title "$NEW_VER" --generate-notes --latest
          fi
