# npm test (node --test test/*.test.mjs) 를 Node 22 와 24 에서 돌린다 (의존성 없음, 합성 데이터만 쓰는 테스트).
# 지원 하한은 Node 22(package.json engines >=22)이고, 22 와 24 를 둘 다 테스트한다. .nvmrc 의 24 는 개발 기본값이다.
name: test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
