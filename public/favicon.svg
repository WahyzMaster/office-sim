<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f08c5b"/>
      <stop offset="35%" stop-color="#14b8a6"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Squircle Badge (high contrast on both dark & light Chrome tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgA)" stroke="#334155" stroke-width="2"/>
  <!-- Context Fuel Ring at bottom -->
  <ellipse cx="32" cy="50" rx="20" ry="7.5" fill="none" stroke="url(#ringA)" stroke-width="3" opacity="0.95"/>
  <!-- 1F Left Wall (Claude Coral) -->
  <polygon points="12,35 32,45 32,53 12,43" fill="#e07040"/>
  <!-- 1F Right Wall (Codex Mint) -->
  <polygon points="52,35 32,45 32,53 52,43" fill="#0d9488"/>
  <!-- 2F Left Wall (Grok Violet) -->
  <polygon points="12,24 32,34 32,43 12,33" fill="#9333ea"/>
  <!-- 2F Right Wall (Antigravity Cyan) -->
  <polygon points="52,24 32,34 32,43 52,33" fill="#0284c7"/>
  <!-- Isometric Roof / Floor Deck (4 Agent Quadrants) -->
  <polygon points="32,14 42,19 32,24 22,19" fill="#f08c5b"/>
  <polygon points="42,19 52,24 42,29 32,24" fill="#14b8a6"/>
  <polygon points="22,19 32,24 22,29 12,24" fill="#a855f7"/>
  <polygon points="32,24 42,29 32,34 22,29" fill="#38bdf8"/>
  <!-- Roof Rim Highlight -->
  <polygon points="32,14 52,24 32,34 12,24" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Bot Visor Pill on Front Edge -->
  <rect x="21" y="29" width="22" height="9" rx="4.5" fill="#090d16" stroke="#f8fafc" stroke-width="1.5"/>
  <circle cx="27.5" cy="33.5" r="2.2" fill="#38bdf8"/>
  <circle cx="36.5" cy="33.5" r="2.2" fill="#10b981"/>
  <!-- Antenna Spark -->
  <line x1="32" y1="7" x2="32" y2="14" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="32" cy="7" r="3" fill="#fbbf24"/>
</svg>